name: edusistem_front
description: "EduSistem — plataforma académica de gestión y calificación para profesores."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.svg
    - assets/branding/logo_symbol.svg
    - assets/branding/logo_symbol_on_light.svg

# App icon (Android + web). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3577E4"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#3577E4"
    theme_color: "#3577E4"

# Launch splash (Android + web). Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#3577E4"
  image: "assets/branding/splash.png"
  color_dark: "#122036"
  image_dark: "assets/branding/splash.png"
  android_12:
    image: "assets/branding/splash.png"
    color: "#3577E4"
    image_dark: "assets/branding/splash.png"
    color_dark: "#122036"
  ios: false
  web: true
